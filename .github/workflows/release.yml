name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - name: asset
        run: |
          cp target/x86_64-unknown-linux-musl/release/picrew-agent \
            picrew-agent-x86_64-unknown-linux-musl
          chmod +x picrew-agent-x86_64-unknown-linux-musl
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            picrew-agent-x86_64-unknown-linux-musl

  darwin-arm64:
    runs-on: macos-14
    needs: linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: cargo build --release --target aarch64-apple-darwin
      - name: asset
        run: |
          cp target/aarch64-apple-darwin/release/picrew-agent \
            picrew-agent-aarch64-apple-darwin
          chmod +x picrew-agent-aarch64-apple-darwin
      - name: upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" picrew-agent-aarch64-apple-darwin --clobber
